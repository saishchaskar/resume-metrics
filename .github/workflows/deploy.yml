name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Google service account secret
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          raw = os.environ.get('GCP_SA_KEY', '')
          if not raw:
              sys.exit('GCP_SA_KEY is empty. Add the service-account JSON as a GitHub Actions secret.')
          if raw.startswith('\ufeff'):
              sys.exit('GCP_SA_KEY starts with a BOM. Re-save the JSON as UTF-8 without BOM, then update the secret.')
          if '\x00' in raw:
              sys.exit('GCP_SA_KEY contains NUL bytes and is likely UTF-16 encoded. Re-save it as UTF-8 JSON, then update the secret.')
          try:
              credential = json.loads(raw)
          except json.JSONDecodeError:
              sys.exit('GCP_SA_KEY is not raw valid JSON. Re-copy the downloaded service-account JSON; do not Base64 encode it or include surrounding quotes.')
          required = {'type', 'project_id', 'private_key', 'client_email'}
          if credential.get('type') != 'service_account' or not required.issubset(credential):
              sys.exit('GCP_SA_KEY JSON is missing service-account fields. Download a service-account key JSON and update the secret.')
          print('GCP_SA_KEY contains valid service-account JSON.')
          PY

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authenticate Docker to GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build Docker image
        run: docker build -f resume-screening-backend/Dockerfile -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/flask-app:$GITHUB_SHA resume-screening-backend

      - name: Push Docker image to Google Container Registry
        run: docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/flask-app:$GITHUB_SHA

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy flask-app \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/flask-app:$GITHUB_SHA \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars APP_ENV=production,GCS_BUCKET_NAME=${{ vars.GCS_BUCKET_NAME || 'resume-screening-resumes' }} \
            --set-secrets JWT_SECRET_KEY=JWT_SECRET_KEY:latest
