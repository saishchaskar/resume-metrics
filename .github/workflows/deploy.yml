name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Google service account secret
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          raw = os.environ.get('GCP_SA_KEY', '')
          if not raw:
              sys.exit('GCP_SA_KEY is empty. Add the service-account JSON as a GitHub Actions secret.')
          if raw.startswith('\ufeff'):
              sys.exit('GCP_SA_KEY starts with a BOM. Re-save the JSON as UTF-8 without BOM, then update the secret.')
          if '\x00' in raw:
              sys.exit('GCP_SA_KEY contains NUL bytes and is likely UTF-16 encoded. Re-save it as UTF-8 JSON, then update the secret.')
          try:
              credential = json.loads(raw)
          except json.JSONDecodeError:
              sys.exit('GCP_SA_KEY is not raw valid JSON. Re-copy the downloaded service-account JSON; do not Base64 encode it or include surrounding quotes.')
          required = {'type', 'project_id', 'private_key', 'client_email'}
          if credential.get('type') != 'service_account' or not required.issubset(credential):
              sys.exit('GCP_SA_KEY JSON is missing service-account fields. Download a service-account key JSON and update the secret.')
          print('GCP_SA_KEY contains valid service-account JSON.')
          PY

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authenticate Docker to GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build Docker image
        run: docker build -f resume-screening-backend/Dockerfile -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/flask-backend-app:$GITHUB_SHA resume-screening-backend

      - name: Push Docker image to Google Container Registry
        run: docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/flask-backend-app:$GITHUB_SHA

      - name: Confirm existing Cloud Run service
        run: gcloud run services describe flask-backend-app --platform managed --region asia-south1 --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Confirm pipeline resources exist
        env:
          TASK_SERVICE_ACCOUNT: ${{ vars.CLOUD_TASKS_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$TASK_SERVICE_ACCOUNT" ]; then
            echo "Set the GitHub Actions variable CLOUD_TASKS_SERVICE_ACCOUNT before deploying."
            exit 1
          fi
          gcloud firestore databases describe --database='(default)' --project '${{ secrets.GCP_PROJECT_ID }}'
          gcloud tasks queues describe resumemetrics-batch-scoring --location=asia-south1 --project '${{ secrets.GCP_PROJECT_ID }}'
          gcloud iam service-accounts describe "$TASK_SERVICE_ACCOUNT" --project '${{ secrets.GCP_PROJECT_ID }}'

      - name: Deploy to Cloud Run
        run: |
          RUNTIME_SA="$(gcloud run services describe flask-backend-app --platform managed --region asia-south1 --project '${{ secrets.GCP_PROJECT_ID }}' --format='value(spec.template.spec.serviceAccountName)')"
          TASK_SA="${{ vars.CLOUD_TASKS_SERVICE_ACCOUNT }}"
          BUCKET_NAME="${{ vars.GCS_BUCKET_NAME || 'resume-screening-resumes' }}"
          if [ -z "$TASK_SA" ]; then
            echo "Set the GitHub Actions variable CLOUD_TASKS_SERVICE_ACCOUNT before deploying (for example resumemetrics-task-invoker@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com)."
            exit 1
          fi
          gcloud run deploy flask-backend-app \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/flask-backend-app:$GITHUB_SHA \
            --platform managed \
            --region asia-south1 \
            --allow-unauthenticated \
            --port 8080 \
            --timeout 900 \
            --max 3 \
            --concurrency 4 \
            --set-env-vars "^@^APP_ENV=production@GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}@GCS_BUCKET_NAME=$BUCKET_NAME@CORS_ALLOWED_ORIGINS=https://ocr-text-50a5b.web.app,https://ocr-text-50a5b.firebaseapp.com@CLOUD_TASKS_LOCATION=asia-south1@CLOUD_TASKS_QUEUE=resumemetrics-batch-scoring@CLOUD_TASKS_SERVICE_ACCOUNT=$TASK_SA@BATCH_WORKER_URL=https://flask-backend-app-879571205118.asia-south1.run.app@INTEGRATION_WORKER_URL=https://flask-backend-app-879571205118.asia-south1.run.app@BATCH_PREPROCESS_JOB=resumemetrics-batch-preprocess@CLOUD_RUN_JOB_REGION=asia-south1@MAX_BATCH_ZIP_BYTES=1073741824@MAX_BATCH_EXPANDED_BYTES=10737418240" \
            --set-secrets JWT_SECRET_KEY=JWT_SECRET_KEY:latest

          gcloud run jobs deploy resumemetrics-batch-preprocess \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/flask-backend-app:$GITHUB_SHA \
            --region asia-south1 \
            --project '${{ secrets.GCP_PROJECT_ID }}' \
            --service-account "$RUNTIME_SA" \
            --command python \
            --args batch_preprocessor.py \
            --tasks 1 \
            --parallelism 1 \
            --max-retries 1 \
            --task-timeout 1h \
            --cpu 2 \
            --memory 4Gi \
            --set-env-vars "^@^GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}@GCS_BUCKET_NAME=$BUCKET_NAME@CLOUD_TASKS_LOCATION=asia-south1@CLOUD_TASKS_QUEUE=resumemetrics-batch-scoring@CLOUD_TASKS_SERVICE_ACCOUNT=$TASK_SA@BATCH_WORKER_URL=https://flask-backend-app-879571205118.asia-south1.run.app@MAX_BATCH_ZIP_BYTES=1073741824@MAX_BATCH_EXPANDED_BYTES=10737418240"
